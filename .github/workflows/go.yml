name: go test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Go environment
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'
    - run: go version

    - name: Test
      run: go test -v ./...
